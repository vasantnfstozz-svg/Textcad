<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextCAD Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #22262e; --line: #2e3340;
    --text: #d7dce5; --dim: #8a93a5; --accent: #4da3ff; --ok: #3fbf6f;
    --fail: #ff5d5d; --stale: #d9a23c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column; font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header .doc { color: var(--dim); }
  header .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  /* chat */
  #chatPane { width: 320px; display: flex; flex-direction: column;
              background: var(--panel); border-right: 1px solid var(--line); }
  #chatLog { flex: 1; overflow-y: auto; padding: 12px; display: flex;
             flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 10px; max-width: 92%;
         white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #2a3f5c; align-self: flex-end; }
  .msg.bot  { background: var(--panel2); align-self: flex-start; }
  #chatForm { display: flex; gap: 8px; padding: 10px;
              border-top: 1px solid var(--line); }
  #chatInput { flex: 1; background: var(--panel2); border: 1px solid var(--line);
               border-radius: 6px; color: var(--text); padding: 8px; font: inherit; }
  /* tree */
  #treePane { width: 360px; overflow-y: auto; background: var(--panel);
              border-right: 1px solid var(--line); padding: 12px; }
  #treePane h2, #chatPane h2 { font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); padding: 10px 12px 0; }
  #treePane h2 { padding: 0 0 8px; }
  .feature { border: 1px solid var(--line); border-radius: 8px;
             margin-bottom: 8px; background: var(--panel2); overflow: hidden; }
  .fhead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
  .badge { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .badge.ok { background: var(--ok); } .badge.failed { background: var(--fail); }
  .badge.stale { background: var(--stale); }
  .fid { font-weight: 600; }
  .fop { color: var(--dim); font-size: 12px; }
  .params { padding: 2px 10px 8px 27px; }
  .prow { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .pname { color: var(--dim); min-width: 110px; }
  .pval { color: var(--accent); cursor: pointer; border-bottom: 1px dashed
          transparent; }
  .pval:hover { border-bottom-color: var(--accent); }
  .pval input { width: 90px; background: var(--bg); color: var(--text);
                border: 1px solid var(--accent); border-radius: 4px;
                padding: 1px 5px; font: inherit; }
  .problems { padding: 0 10px 8px 27px; color: var(--fail); font-size: 12px; }
  .specbox { border-radius: 8px; padding: 8px 10px; margin-top: 10px;
             border: 1px solid var(--line); }
  .specbox.ok { border-color: var(--ok); } .specbox.fail { border-color: var(--fail); }
  /* viewer */
  #viewerPane { flex: 1; position: relative; }
  #viewer { position: absolute; inset: 0; }
  #busy { position: absolute; inset: 0; display: none; align-items: center;
          justify-content: center; background: rgba(10,12,15,.55); z-index: 5;
          font-size: 15px; color: var(--text); backdrop-filter: blur(2px); }
  /* dropdown */
  .dropdown { position: relative; }
  .dropdown .menu { display: none; position: absolute; right: 0; top: 110%;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    min-width: 260px; z-index: 20; overflow: hidden; }
  .dropdown:hover .menu, .dropdown:focus-within .menu { display: block; }
  .dropdown .menu a { display: block; padding: 9px 13px; cursor: pointer; }
  .dropdown .menu a:hover { background: #2a3f5c; }
  /* node action buttons */
  .fhead .spacer { flex: 1; }
  .nbtn { background: none; border: none; color: var(--dim); cursor: pointer;
          padding: 0 4px; font-size: 13px; }
  .nbtn:hover { color: var(--text); }
  .feature.suppressed { opacity: .45; }
  /* add-feature dialog */
  dialog { background: var(--panel); color: var(--text); border: 1px solid
    var(--line); border-radius: 12px; padding: 18px 20px; min-width: 340px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin-bottom: 12px; }
  dialog label { display: block; margin: 8px 0 2px; color: var(--dim);
                 font-size: 12px; }
  dialog input, dialog select { width: 100%; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    padding: 7px 9px; font: inherit; }
  dialog .checks { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
  dialog .checks label { display: flex; gap: 4px; align-items: center;
    margin: 0; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px;
    color: var(--text); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px;
                margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Text<span>CAD</span> Studio</h1>
  <span class="doc" id="docName">—</span>
  <div class="spacer"></div>
  <button id="newBtn">🗋 New</button>
  <button id="addFeatBtn">＋ Add feature</button>
  <div class="dropdown">
    <button>📚 Examples ▾</button>
    <div class="menu">
      <a data-sample="flange">Flange (6-bolt)</a>
      <a data-sample="impeller">Impeller (7 curved blades)</a>
      <a data-sample="compressor" title="physics-designed by the meanline calculator; rebuilds take a while">Compressor — meanline designed</a>
    </div>
  </div>
  <button id="exportBtn">Export STEP</button>
</header>

<dialog id="featDialog">
  <form id="featForm" method="dialog">
    <h3>Add feature</h3>
    <label>Operation
      <select id="featOp"></select>
    </label>
    <label>Name (id)
      <input id="featId" required placeholder="e.g. bore2">
    </label>
    <div id="featParams"></div>
    <div id="featInputsWrap">
      <label>Inputs (upstream features)</label>
      <div id="featInputs" class="checks"></div>
    </div>
    <div class="row">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="featOk" value="ok">Add</button>
    </div>
  </form>
</dialog>
<main>
  <div id="chatPane">
    <h2>Chat</h2>
    <div id="chatLog"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder='e.g. "make the bore 12mm"' autocomplete="off">
      <button>Send</button>
    </form>
  </div>
  <div id="treePane">
    <h2>Feature tree</h2>
    <div id="tree"></div>
  </div>
  <div id="viewerPane">
    <div id="viewer"></div>
    <div id="busy">rebuilding…</div>
  </div>
</main>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

/* ---------- 3D viewer ---------- */
const pane = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
pane.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.0));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(1, 1, 2); scene.add(dir);
const grid = new THREE.GridHelper(300, 30, 0x2e3340, 0x22262e);
grid.rotation.x = Math.PI / 2; scene.add(grid);
let mesh = null;

function resize() {
  const w = pane.clientWidth, h = pane.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
new ResizeObserver(resize).observe(pane);

(function animate() { requestAnimationFrame(animate);
  controls.update(); renderer.render(scene, camera); })();

async function loadMesh(fit = false) {
  try {
    const geo = await new STLLoader().loadAsync('/api/mesh.stl?t=' + Date.now());
    geo.computeVertexNormals();
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0x4da3ff, metalness: 0.35, roughness: 0.45 }));
    scene.add(mesh);
    if (fit) {
      geo.computeBoundingSphere();
      const { center, radius } = geo.boundingSphere;
      controls.target.copy(center);
      camera.position.set(center.x + radius * 1.9, center.y - radius * 1.9,
                          center.z + radius * 1.4);
      camera.near = radius / 100; camera.far = radius * 100;
      camera.updateProjectionMatrix();
    }
  } catch (e) { /* no mesh yet */ }
}

/* ---------- feature tree ---------- */
const treeEl = document.getElementById('tree');
const busy = document.getElementById('busy');
let lastDoc = null;

function renderDoc(doc) {
  lastDoc = doc;
  document.getElementById('docName').textContent = doc.name;
  treeEl.innerHTML = '';
  for (const f of doc.features) {
    const card = document.createElement('div'); card.className = 'feature';
    if (f.suppressed) card.classList.add('suppressed');
    const head = document.createElement('div'); head.className = 'fhead';
    head.innerHTML = `<span class="badge ${f.status}"></span>
      <span class="fid">${f.id}</span><span class="fop">${f.op}` +
      (f.inputs.length ? ` ← ${f.inputs.join(', ')}` : '') + `</span>
      <span class="spacer"></span>`;
    const sup = document.createElement('button'); sup.className = 'nbtn';
    sup.textContent = f.suppressed ? '▶' : '⏸';
    sup.title = f.suppressed ? 'unsuppress' : 'suppress';
    sup.onclick = () => postJSON('/api/feature/suppress',
      { feature_id: f.id, suppressed: !f.suppressed });
    const del = document.createElement('button'); del.className = 'nbtn';
    del.textContent = '✕'; del.title = 'delete feature';
    del.onclick = () => postJSON('/api/feature/remove', { feature_id: f.id });
    head.append(sup, del);
    card.appendChild(head);
    const params = document.createElement('div'); params.className = 'params';
    for (const [k, v] of Object.entries(f.params)) {
      const row = document.createElement('div'); row.className = 'prow';
      const editable = typeof v === 'number';
      row.innerHTML = `<span class="pname">${k}</span>`;
      const val = document.createElement('span'); val.className = 'pval';
      val.textContent = Array.isArray(v) ? `[${v.length} points]` : v;
      if (editable) {
        val.title = 'click to edit';
        val.onclick = () => beginEdit(val, f.id, k, v);
      } else { val.style.cursor = 'default'; val.style.color = 'var(--dim)'; }
      row.appendChild(val); params.appendChild(row);
    }
    if (f.volume != null) {
      const row = document.createElement('div'); row.className = 'prow';
      row.innerHTML = `<span class="pname">volume</span>
        <span style="color:var(--dim)">${f.volume} mm³</span>`;
      params.appendChild(row);
    }
    card.appendChild(params);
    const probs = f.problems.filter(p => p !== '(suppressed)');
    if (probs.length) {
      const pr = document.createElement('div'); pr.className = 'problems';
      pr.textContent = probs.join(' • '); card.appendChild(pr);
    }
    treeEl.appendChild(card);
  }
  if (doc.spec && Object.keys(doc.spec).length) {
    const box = document.createElement('div');
    box.className = 'specbox ' + (doc.spec_problems.length ? 'fail' : 'ok');
    box.innerHTML = `<b>spec ${doc.spec_problems.length ? 'FAIL' : 'PASS'}</b> — ` +
      Object.entries(doc.spec).filter(([,v]) => v != null)
        .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ') +
      doc.spec_problems.map(p => `<div style="color:var(--fail)">! ${p}</div>`).join('');
    treeEl.appendChild(box);
  }
}

function beginEdit(el, fid, param, oldVal) {
  const input = document.createElement('input');
  input.value = oldVal; el.replaceChildren(input); input.focus(); input.select();
  const done = async commit => {
    if (commit && input.value !== '' && Number(input.value) !== oldVal) {
      await postEdit(fid, param, Number(input.value));
    } else { el.textContent = oldVal; }
  };
  input.onkeydown = e => { if (e.key === 'Enter') done(true);
                           if (e.key === 'Escape') done(false); };
  input.onblur = () => done(false);
}

async function postJSON(url, body) {
  busy.style.display = 'flex';
  const r = await fetch(url, { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {}) });
  const doc = await r.json();
  busy.style.display = 'none';
  if (doc.error) addMsg('bot', '⚠ ' + doc.error);
  renderDoc(doc); loadMesh();
  return doc;
}
const postEdit = (fid, param, value) =>
  postJSON('/api/edit', { feature_id: fid, param, value });

/* ---------- chat ---------- */
const log = document.getElementById('chatLog');
function addMsg(who, text) {
  const d = document.createElement('div'); d.className = 'msg ' + who;
  d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
document.getElementById('chatForm').onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if (!text) return;
  input.value = ''; addMsg('user', text);
  busy.style.display = 'flex';
  const r = await fetch('/api/chat', { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ message: text }) });
  const doc = await r.json();
  busy.style.display = 'none';
  addMsg('bot', doc.reply || '…'); renderDoc(doc); loadMesh();
};

/* ---------- header ---------- */
for (const btn of document.querySelectorAll('[data-sample]')) {
  btn.onclick = async () => {
    const doc = await postJSON('/api/sample/' + btn.dataset.sample);
    loadMesh(true);
    addMsg('bot', `Loaded example "${doc.name}". Click any blue value in the ` +
                  `tree, or tell me what to change.`);
  };
}

document.getElementById('newBtn').onclick = async () => {
  const name = prompt('Name for the new design:', 'my-part');
  if (name === null) return;
  await postJSON('/api/new', { name });
  if (mesh) { scene.remove(mesh); mesh = null; }
  addMsg('bot', `Blank design "${name}" created. Describe the part you want ` +
    `("design a pulley, 60mm...") or use ＋ Add feature to build manually.`);
};

/* ---------- add-feature dialog ---------- */
const dlg = document.getElementById('featDialog');
let OPS = [];
document.getElementById('addFeatBtn').onclick = async () => {
  if (!OPS.length) OPS = await (await fetch('/api/ops')).json();
  const sel = document.getElementById('featOp');
  sel.innerHTML = OPS.map(o =>
    `<option value="${o.op}">${o.op} (${o.kind})</option>`).join('');
  sel.onchange = renderFeatForm; renderFeatForm();
  dlg.showModal();
};

function renderFeatForm() {
  const op = OPS.find(o => o.op === document.getElementById('featOp').value);
  const pDiv = document.getElementById('featParams');
  pDiv.innerHTML = op.params.map(p => `
    <label>${p.name}
      <input data-param="${p.name}" value="${p.default ?? ''}"
        placeholder="${p.name === 'points' ? '[[r,z],[r,z],...]' : 'number'}">
    </label>`).join('');
  const iDiv = document.getElementById('featInputs');
  const doc = lastDoc || { features: [] };
  document.getElementById('featInputsWrap').style.display =
    op.inputs > 0 ? '' : 'none';
  iDiv.innerHTML = doc.features.map(f =>
    `<label><input type="checkbox" value="${f.id}">${f.id}</label>`).join('') ||
    '<span style="color:var(--dim)">no features yet</span>';
}

document.getElementById('featForm').onsubmit = async e => {
  if (e.submitter && e.submitter.value === 'cancel') return;
  e.preventDefault(); dlg.close();
  const op = document.getElementById('featOp').value;
  const params = {};
  for (const inp of document.querySelectorAll('#featParams input')) {
    const v = inp.value.trim(); if (!v) continue;
    params[inp.dataset.param] = v.startsWith('[') ? JSON.parse(v) : Number(v);
  }
  const inputs = [...document.querySelectorAll('#featInputs input:checked')]
    .map(c => c.value);
  const doc = await postJSON('/api/feature/add',
    { id: document.getElementById('featId').value, op, params, inputs });
  if (!doc.error) loadMesh(doc.features.length === 1);
};
document.getElementById('exportBtn').onclick = async () => {
  const r = await fetch('/api/export', { method: 'POST' });
  const res = await r.json();
  addMsg('bot', res.error ? '⚠ ' + res.error : 'Exported: ' + res.path);
};

/* ---------- boot ---------- */
const doc = await (await fetch('/api/doc')).json();
renderDoc(doc); loadMesh(true);
addMsg('bot', 'Welcome to TextCAD Studio. Every edit rebuilds through the ' +
  'verified pipeline — the tree shows each feature\'s health and the spec ' +
  'verdict. Try: "make the bore 12mm".');
</script>
</body>
</html>
