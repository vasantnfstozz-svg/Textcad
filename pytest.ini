[pytest]
# LAUNCH-PLAN.md R6 — code tests run on frozen fixtures and must be green at
# every commit; the health of the user's LIVE designs/ library is a separate,
# opt-in question:  python -m pytest tests -m library -q
markers =
    library: reads the user's live designs/ library (opt-in; excluded by default)
addopts = -m "not library"
